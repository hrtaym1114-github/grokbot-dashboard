<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ネタ振り分け</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #f6f4ef; color: #1c1a17; }
  h1 { font-size: 1.4rem; }
  .meta { color: #5c564e; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .xpost, .notepost { margin-top: 10px; }
  .xpost p, .notepost p { margin: 8px 0; white-space: pre-wrap; line-height: 1.5; }
  .xlink { display: block; margin-top: 8px; border: 1px solid #e2ddd4; border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; }
  .xlink .site { font-size: 12px; color: #5c564e; padding: 8px 10px 0; }
  .xlink strong, .xlink .desc { display: block; padding: 2px 10px; }
  .xlink .desc { color: #5c564e; font-size: 13px; padding-bottom: 10px; }
  .notepost h2 { font-size: 1.35rem; line-height: 1.35; margin: 8px 0; }
  .notepost .lead { font-size: 1.05rem; }
  .cites { margin-top: 8px; font-size: 14px; }
  .cites li { margin: 4px 0; }
  .card { background: #fff; border: 1px solid #e2ddd4; border-radius: 12px; padding: 14px; }
  .draft { margin-top: 10px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; background: #f6f4ef; padding: 10px; border-radius: 8px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #efeae2; margin-right: 6px; }
  select { margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  td, th { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
  a { color: #1d4e89; }
  .card.wide { grid-column: 1 / -1; }
  .shelf-rows { overflow-x: auto; margin-top: 8px; }
  .shelf-rows table { min-width: 720px; }
  .shelf-rows th.group { background: #efeae2; font-weight: 600; }
  .shelf-rows td { vertical-align: top; line-height: 1.45; }
</style>
</head>
<body>
<h1>日次のネタ振り分け</h1>
<p class="meta" id="meta">読み込み中</p>
<div class="grid" id="cards"></div>
<h2>出ていないチャンネル</h2>
<ul id="empty"></ul>
<h2>棚卸し</h2>
<div class="grid" id="shelf"></div>
<h2>履歴</h2>
<table><thead><tr><th>日付</th><th>チャンネル</th><th>タイトル</th><th>状態</th></tr></thead><tbody id="history"></tbody></table>
<p class="meta">プルダウンはこのブラウザの表示だけ。ファイルを承認にするには、GitHub にログインした状態で Actions の Approve card を実行し、カードIDを入れる。公開ページからは API を叩かない。</p>
<script>
const KEY = "routing-status-overrides";
function loadOverrides() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
}
function saveOverride(id, state) {
  const all = loadOverrides();
  all[id] = state;
  localStorage.setItem(KEY, JSON.stringify(all));
}
function nextXSlot(from) {
  const d = new Date(from.getTime());
  d.setSeconds(0, 0);
  for (let i = 0; i < 24 * 60; i++) {
    d.setMinutes(d.getMinutes() + 1);
    if (d.getMinutes() === 7 && d.getHours() >= 4) return d;
  }
  return d;
}
function fmtTime(d) {
  return d.getHours() + "時" + String(d.getMinutes()).padStart(2, "0") + "分";
}
function statusLabel(card, state) {
  const status = state.status || card.status;
  if (status === "承認" && card.channel === "X") {
    const when = state.scheduledAt ? new Date(state.scheduledAt) : nextXSlot(new Date());
    return "承認（投稿待ち・" + fmtTime(when) + "予定）";
  }
  if (status === "承認") return "承認（投稿待ち）";
  if (status === "投稿済み") {
    const t = state.postedAt || card.postedAt;
    return t ? "投稿済み（" + fmtTime(new Date(t)) + "）" : "投稿済み";
  }
  return status || "未投稿";
}
fetch("data/latest.json").then(r => r.json()).then(data => {
  const overrides = loadOverrides();
  document.getElementById("meta").textContent =
    data.date + " / ブックマーク: " + (data.bookmarks === "skipped" ? "当日分なし" : "あり");
  const cards = document.getElementById("cards");
  for (const card of data.cards) {
    const status = overrides[card.id] || card.status;
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML = `<div><span class="tag">${card.channel}</span><span class="tag">${card.source}</span></div>
      <h3><a href="${card.url}">${card.title}</a></h3>`;
    const label = document.createElement("span");
    label.className = "tag";
    label.textContent = "投稿プレビュー";
    if (card.channel === "X" && card.preview) {
      const box = document.createElement("div");
      box.className = "xpost";
      box.appendChild(label);
      const text = document.createElement("p");
      text.textContent = card.preview.text || "";
      box.appendChild(text);
      const link = document.createElement("a");
      link.className = "xlink";
      link.href = card.preview.url || card.url;
      link.target = "_blank";
      const site = document.createElement("div");
      site.className = "site";
      site.textContent = card.preview.siteName || "";
      const title = document.createElement("strong");
      title.textContent = card.preview.title || "";
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = card.preview.description || "";
      link.append(site, title, desc);
      box.appendChild(link);
      el.appendChild(box);
    } else if (card.channel === "note" && card.preview) {
      const box = document.createElement("div");
      box.className = "notepost";
      box.appendChild(label);
      const h = document.createElement("h2");
      h.textContent = card.preview.title || "";
      const lead = document.createElement("p");
      lead.className = "lead";
      lead.textContent = card.preview.lead || "";
      const body = document.createElement("p");
      body.textContent = card.preview.bodyPreview || "";
      box.append(h, lead, body);
      el.appendChild(box);
    } else if (card.draft) {
      const draft = document.createElement("div");
      draft.className = "draft";
      const dlabel = document.createElement("span");
      dlabel.className = "tag";
      dlabel.textContent = "投稿文の下書き";
      const body = document.createElement("p");
      body.textContent = card.draft;
      draft.append(dlabel, body);
      el.appendChild(draft);
    }
    if (card.citations && card.citations.length) {
      const cites = document.createElement("div");
      cites.className = "cites";
      const cap = document.createElement("span");
      cap.className = "tag";
      cap.textContent = "引用元";
      const ul = document.createElement("ul");
      for (const cite of card.citations) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = cite.url;
        a.target = "_blank";
        a.textContent = cite.siteName || cite.url;
        li.appendChild(a);
        ul.appendChild(li);
      }
      cites.append(cap, ul);
      el.appendChild(cites);
    }
    const raw = overrides[card.id];
    const state = (raw && typeof raw === "object")
      ? raw
      : { status: (typeof raw === "string" ? raw : card.status), scheduledAt: card.scheduledAt || null, postedAt: card.postedAt || null };
    const shown = document.createElement("p");
    shown.className = "meta";
    const note = document.createElement("p");
    note.className = "meta";
    function paint() {
      shown.textContent = statusLabel(card, state);
      if (card.channel === "X" && state.status === "承認") {
        note.textContent = "表示上の予定。投稿されるのは latest.json が承認になったあと。";
      } else {
        note.textContent = "カードID: " + card.id;
      }
    }
    paint();
    el.appendChild(shown);
    el.appendChild(note);
    const sel = document.createElement("select");
    const blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "選ぶ";
    if (state.status !== "保留" && state.status !== "承認") blank.selected = true;
    sel.appendChild(blank);
    for (const opt of ["保留", "承認"]) {
      const o = document.createElement("option");
      o.value = opt; o.textContent = opt;
      if (opt === state.status) o.selected = true;
      sel.appendChild(o);
    }
    function choose(value) {
      if (!value) return;
      state.status = value;
      if (value === "承認" && card.channel === "X") state.scheduledAt = nextXSlot(new Date()).toISOString();
      if (value !== "承認") state.scheduledAt = null;
      saveOverride(card.id, { status: state.status, scheduledAt: state.scheduledAt || null, postedAt: state.postedAt || null });
      paint();
    }
    sel.addEventListener("change", () => choose(sel.value));
    el.appendChild(sel);
    cards.appendChild(el);
  }
  const empty = document.getElementById("empty");
  for (const [ch, note] of Object.entries(data.empty || {})) {
    const li = document.createElement("li");
    li.textContent = ch + ": " + note;
    empty.appendChild(li);
  }
  const body = document.getElementById("history");
  for (const row of data.history || []) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${row.date}</td><td>${row.channel}</td><td>${row.title}</td><td>${overrides[row.date + "-" + row.channel] || row.status}</td>`;
    body.appendChild(tr);
  }
}).catch(err => {
  document.getElementById("meta").textContent = "データを読めなかった: " + err;
});

fetch("data/shelf-check.json").then(r => r.json()).then(data => {
  const box = document.getElementById("shelf");
  if (!box) return;
  const head = document.createElement("p");
  head.className = "meta";
  head.textContent = "棚卸し " + data.date;
  box.before(head);
  for (const item of data.items || []) {
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML = `<span class="tag">${item.priority}</span> <strong>${item.title}</strong><p>${item.body}</p>`;
    if (item.wide || item.rows) el.classList.add("wide");
    if (Array.isArray(item.rows) && item.rows.length) {
      const wrap = document.createElement("div");
      wrap.className = "shelf-rows";
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      for (const h of ["名前", "何をするか", "いつ（JST）", "最終成功", "状態"]) {
        const th = document.createElement("th"); th.textContent = h; hr.appendChild(th);
      }
      thead.appendChild(hr); table.appendChild(thead);
      const tbody = document.createElement("tbody");
      let group = null;
      for (const row of item.rows) {
        if (row.group && row.group !== group) {
          group = row.group;
          const gr = document.createElement("tr");
          const th = document.createElement("th"); th.colSpan = 5; th.className = "group"; th.textContent = group;
          gr.appendChild(th); tbody.appendChild(gr);
        }
        const tr = document.createElement("tr");
        for (const k of ["name", "what", "when", "last", "state"]) {
          const td = document.createElement("td"); td.textContent = row[k] || ""; tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody); wrap.appendChild(table); el.appendChild(wrap);
    }
    box.appendChild(el);
  }
}).catch(() => {});

</script>
</body>
</html>
